
<div class="card shadow-sm h-100 border-0">
  <div class="card-body">
    <h4 class="titulo-seccion">Habilidades</h4>

    <div class="d-flex flex-wrap gap-2">
      @for (habilidad of habilidades; track habilidad) {
        <span class="badge text-bg-primary p-2">
          {{ habilidad }}
        </span>
      }
    </div>
  </div>
</div>
