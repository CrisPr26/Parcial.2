
<div class="container py-5">

  <app-perfil
    [nombre]="hojaDeVida.nombre"
    [profesion]="hojaDeVida.profesion"
    [descripcion]="hojaDeVida.perfil">
  </app-perfil>

  <div class="row g-4">

    <div class="col-md-6">
      <app-contacto
        [correo]="hojaDeVida.correo"
        [telefono]="hojaDeVida.telefono"
        [ciudad]="hojaDeVida.ciudad">
      </app-contacto>
    </div>

    <div class="col-md-6">
      <app-formacion
        [formacion]="hojaDeVida.formacion">
      </app-formacion>
    </div>

    <div class="col-md-6">
      <app-habilidades
        [habilidades]="hojaDeVida.habilidades">
      </app-habilidades>
    </div>

    <div class="col-md-6">
      <app-proyectos
        [proyectos]="hojaDeVida.proyectos">
      </app-proyectos>
    </div>

  </div>
</div>
